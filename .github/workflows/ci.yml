name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  app:
    name: Typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build

  database:
    name: Database acceptance tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: PGBIN=$(ls -d /usr/lib/postgresql/*/bin | tail -1) bash supabase/tests/run_local_tests.sh
